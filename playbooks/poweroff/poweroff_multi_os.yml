---
- name: Apagar equipos multiplataforma
  hosts: all
  gather_facts: true

  tasks:
    # Se lanza en segundo plano con un pequeño retardo para que Ansible
    # pueda cerrar la conexión SSH antes de que el equipo se apague.
    - name: Apagar sistemas Linux (Debian/Ubuntu/LliureX, RedHat/CentOS...)
      ansible.builtin.shell: sleep 2 && /sbin/shutdown -h now
      async: 30
      poll: 0
      become: true
      changed_when: true
      when: ansible_system == "Linux"

    - name: Apagar sistemas Windows
      ansible.windows.win_command: shutdown /s /t 30 /c "Apagado por Ansible"
      changed_when: true
      when: ansible_os_family == "Windows"

    - name: Esperar desconexión
      block:
        - name: Esperar a que se cierre el puerto de conexión
          ansible.builtin.wait_for:
            host: "{{ ansible_host | default(inventory_hostname) }}"
            port: "{{ ansible_port | default(22) }}"
            state: stopped
            timeout: 120
          delegate_to: localhost
      rescue:
        - name: Avisar si el equipo no se ha apagado
          ansible.builtin.debug:
            msg: "⚠️ {{ inventory_hostname }} no se ha apagado en 120 segundos"
