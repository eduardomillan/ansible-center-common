---
- name: Programar apagado diferido
  hosts: all
  become: true
  vars:
    shutdown_minutes: 10

  tasks:
    - name: Programar apagado en minutos específicos
      ansible.builtin.command: >-
        shutdown -h +{{ shutdown_minutes }}
        "Apagado automático en {{ shutdown_minutes }} minutos - Cancelar con: shutdown -c"
      changed_when: true

    - name: Mostrar confirmación
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} se apagará en {{ shutdown_minutes }} minutos"

- name: Verificar estado de apagado
  hosts: all
  gather_facts: false
  tasks:
    - name: Comprobar si el equipo está apagado
      block:
        - name: Comprobar si el puerto SSH ya está cerrado
          ansible.builtin.wait_for:
            host: "{{ ansible_host | default(inventory_hostname) }}"
            port: 22
            state: stopped
            timeout: 1
          delegate_to: localhost

        - name: Mostrar estado
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} está apagado"
      rescue:
        - name: Mostrar que sigue encendido
          ansible.builtin.debug:
            msg: "{{ inventory_hostname }} sigue encendido (apagado programado)"
