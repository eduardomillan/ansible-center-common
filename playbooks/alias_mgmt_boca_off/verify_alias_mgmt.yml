---
# verify_alias_config.yml
- name: Verificar configuración de alias
  hosts: devices
  become: true
  vars:
    subred_base: "192.168"
    interface_target: "eth0"

  tasks:
    - name: Extraer información del hostname
      ansible.builtin.set_fact:
        es_profesor: "{{ 'profe' in host_name }}"
        id_aula_profesor: "{{ host_name | regex_replace('^[a-zA-Z]+', '') | regex_replace('profe$', '') | regex_replace('\\D', '') }}"
        numero_completo: "{{ host_name | regex_replace('^[a-zA-Z]+', '') }}"

    - name: Calcular aula y máquina de alumno
      ansible.builtin.set_fact:
        id_aula_alumno: "{{ (numero_completo | int) // 100 }}"
        numero_maquina: "{{ (numero_completo | int) % 100 }}"

    - name: Calcular aula final
      ansible.builtin.set_fact:
        id_aula_final: "{{ id_aula if id_aula is defined else (id_aula_profesor if es_profesor else id_aula_alumno) }}"

    - name: Calcular IP esperada
      ansible.builtin.set_fact:
        ip_esperada: "{{ subred_base }}.{{ id_aula_final }}.{{ 250 if es_profesor else numero_maquina }}"

    # Se busca "inet IP/" exacto para que 192.168.1.5 no coincida con 192.168.1.50.
    - name: Verificar alias configurado
      ansible.builtin.shell:
        cmd: "set -o pipefail; ip addr show {{ interface_target }} | grep -F 'inet {{ ip_esperada }}/' >/dev/null"
        executable: /bin/bash
      register: alias_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Verificar archivo Netplan
      ansible.builtin.stat:
        path: "/etc/netplan/99-subnet-alias-{{ host_name }}.yaml"
      register: netplan_file

    - name: Mostrar estado completo
      ansible.builtin.debug:
        msg: |
          Host: {{ host_name }}
          Aula: {{ id_aula_final }}, Máquina: {{ '250 (Profesor)' if es_profesor else numero_maquina }}
          IP Esperada: {{ ip_esperada }}
          Alias: {{ '✅ ACTIVO' if alias_check.rc == 0 else '❌ INACTIVO' }}
          Config Netplan: {{ '✅ PRESENTE' if netplan_file.stat.exists else '❌ AUSENTE' }}
