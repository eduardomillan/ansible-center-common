# Template de inventario para ansible-center
# Copia este archivo a inventory.ini y actualiza con tus valores
#
# USO:
# 1. Copia este archivo: cp inventories/inventory.template.ini inventories/inventory.ini
# 2. Edita inventory.ini con tus hosts
# 3. Ejecuta playbooks: ansible-playbook playbooks/change-hostname/change_host_name.yml -i inventories/inventory.ini

# EJEMPLO BÁSICO:
[devices]
192.168.1.100
192.168.1.101
192.168.1.102

[devices:vars]
ansible_user=ubuntu
ansible_become=yes

# EJEMPLO AVANZADO (con nombres):
# [lab_machines]
# lab-pc-01 ansible_host=192.168.1.100 mac_address=AA:BB:CC:DD:EE:01
# lab-pc-02 ansible_host=192.168.1.101 mac_address=AA:BB:CC:DD:EE:02
#
# [lab_machines:vars]
# ansible_user=ubuntu
# ansible_become=yes
# ansible_python_interpreter=/usr/bin/python3
